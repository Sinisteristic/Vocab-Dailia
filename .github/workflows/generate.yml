name: Generate Vocab via Claude

on:
  workflow_dispatch:
    inputs:
      target:
        description: "จะเพิ่มเข้าคลังไหน"
        required: true
        type: choice
        options:
          - roots_voc
          - archaic_voc
      source_file:
        description: "ชื่อไฟล์ในโฟลเดอร์ sources/ เช่น novel1.txt (เว้นว่างไว้ = สุ่มไฟล์เอง)"
        required: false
        type: string
        default: ""
      count:
        description: "จำนวนคำที่ต้องการ"
        required: false
        default: "3"
  schedule:
    # ทุกวันศุกร์ 23:23 น. เวลาไทย = 16:23 UTC — เติมคำใหม่ roots_voc 12 คำ + archaic_voc 24 คำ
    - cron: "23 16 * * 5"

permissions:
  contents: write

concurrency:
  group: generate-vocab
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide which target(s) to run
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "targets=roots_voc:12 archaic_voc:24" >> "$GITHUB_OUTPUT"
            echo "source_file=" >> "$GITHUB_OUTPUT"
          else
            echo "targets=${{ inputs.target }}:${{ inputs.count }}" >> "$GITHUB_OUTPUT"
            echo "source_file=${{ inputs.source_file }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate + merge (retry-safe, no git merge conflicts)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SOURCE_FILE: ${{ steps.plan.outputs.source_file }}
        run: |
          git config user.name "latin-bot"
          git config user.email "latin-bot@users.noreply.github.com"

          for pair in ${{ steps.plan.outputs.targets }}; do
            TARGET="${pair%%:*}"
            COUNT="${pair##*:}"
            export TARGET COUNT
            echo "=== สร้างคำใหม่: target=$TARGET count=$COUNT ==="
            python3 generate_vocab.py

            for i in 1 2 3 4 5; do
              echo "--- merge รอบที่ $i (target=$TARGET) ---"
              git fetch origin main
              git reset --hard origin/main

              python3 merge_vocab.py

              git add roots_voc.json archaic_voc.json
              if git diff --cached --quiet; then
                echo "ไม่มีอะไรต้อง commit สำหรับ $TARGET"
                break
              fi
              git commit -m "Add vocab via Claude ($TARGET)"

              if git push origin HEAD:main; then
                echo "push สำเร็จสำหรับ $TARGET"
                break
              fi
              echo "push ไม่สำเร็จ ลองใหม่..."
              sleep $((RANDOM % 5 + 2))
            done
          done
