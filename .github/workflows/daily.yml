name: Daily Latin Vocabulary

on:
  schedule:
    # จันทร์-ศุกร์ 12:00 น. เวลาไทย = 05:00 UTC
    - cron: "0 5 * * 1-5"
    # เสาร์-อาทิตย์ 17:00 น. เวลาไทย = 10:00 UTC
    - cron: "0 10 * * 0,6"
  workflow_dispatch: {}  # ให้กดรันเองได้จากหน้า Actions เพื่อทดสอบ

permissions:
  contents: write

jobs:
  send-words:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send today's words
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # จันทร์-ศุกร์ (หรือกดรันเอง) = 2+4 / เสาร์-อาทิตย์ = 1+2
          ROOTS_PER_DAY: ${{ github.event.schedule == '0 10 * * 0,6' && '1' || '2' }}
          ARCHAIC_PER_DAY: ${{ github.event.schedule == '0 10 * * 0,6' && '2' || '4' }}
        run: python3 send_daily.py

      - name: Commit updated progress
        run: |
          git config user.name "latin-bot"
          git config user.email "latin-bot@users.noreply.github.com"
          git add progress.json
          git diff --cached --quiet || git commit -m "update progress"
          git push
