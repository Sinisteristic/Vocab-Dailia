name: Generate Vocab via Claude

on:
  workflow_dispatch:
    inputs:
      target:
        description: "จะเพิ่มเข้าคลังไหน"
        required: true
        type: choice
        options:
          - naming_roots
          - old_english
      source_file:
        description: "ชื่อไฟล์ในโฟลเดอร์ sources/ เช่น novel1.txt (เว้นว่างไว้ = สุ่มไฟล์เอง)"
        required: false
        type: string
        default: ""
      count:
        description: "จำนวนคำที่ต้องการ"
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: generate-vocab
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ask Claude for new vocab (writes pending_new_items.json only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET: ${{ inputs.target }}
          SOURCE_FILE: ${{ inputs.source_file }}
          COUNT: ${{ inputs.count }}
        run: python3 generate_vocab.py

      - name: Merge into main file and push (retry-safe, no git merge conflicts)
        run: |
          git config user.name "latin-bot"
          git config user.email "latin-bot@users.noreply.github.com"

          for i in 1 2 3 4 5; do
            echo "=== รอบที่ $i ==="
            git fetch origin main
            git reset --hard origin/main

            python3 merge_vocab.py

            git add naming_roots.json old_english_vocab.json
            if git diff --cached --quiet; then
              echo "ไม่มีอะไรต้อง commit (อาจถูก merge ไปแล้วโดย run อื่น)"
              exit 0
            fi
            git commit -m "Add vocab via Claude (${{ inputs.target }} from ${{ inputs.source_file }})"

            if git push origin HEAD:main; then
              echo "push สำเร็จ"
              exit 0
            fi
            echo "push ไม่สำเร็จ (มี commit อื่นแซงหน้า) — ลองใหม่..."
            sleep $((RANDOM % 5 + 2))
          done

          echo "push ไม่สำเร็จหลังจากลอง 5 รอบ"
          exit 1
